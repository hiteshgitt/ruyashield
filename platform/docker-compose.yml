# Local development only. Ports are bound to 127.0.0.1 and chosen to avoid
# other projects on this host (see infra/README.md).
name: ruyashield
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ruya_owner
      POSTGRES_PASSWORD: ruya_owner_dev
      POSTGRES_DB: ruyashield
    ports:
      - "127.0.0.1:5450:5432"
    volumes:
      - ruyashield-pg:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruya_owner -d ruyashield"]
      interval: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1035:1025"
      - "127.0.0.1:8035:8025"
volumes:
  ruyashield-pg:
